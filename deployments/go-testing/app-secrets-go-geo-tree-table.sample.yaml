# -----------------------------------------------------------------------------
# SAMPLE Kubernetes Secret Manifest for go-geo-tree-table
#
# HOW TO USE:
# 1. Fill in all 'changeme_' values with your production/staging configuration.
# 2. Save this file as 'app-secrets-go-geo-tree-table.yaml' (DO NOT COMMIT).
# 3. Use the 'kubeseal' CLI to create 'sealed-app-secrets-go-geo-tree-table.yaml'.
#    (See README.md for the full Kubernetes deployment workflow).
#
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-go-geo-tree-table
  namespace: go-testing # <-- Change this to your target namespace
type: Opaque
stringData:
  # ----------------------------------
  # Database (PostgreSQL)
  # ----------------------------------
  DB_DRIVER: "postgres"
  DB_HOST: "your-db-host.internal.cluster.local" # <-- K8s service name for your DB
  DB_PORT: "5432"
  DB_NAME: "go_geo_tree_table"
  DB_USER: "go_geo_tree_table"
  DB_PASSWORD: "changeme_db_password"
  DB_SSL_MODE: "prefer"

  # ----------------------------------
  # JWT (Authentication)
  # ----------------------------------
  JWT_SECRET: "changeme_super_secret_jwt_key_32_chars+"
  JWT_ISSUER_ID: "changeme-your-issuer-uuid"
  JWT_CONTEXT_KEY: "gojwtdata"
  JWT_DURATION_MINUTES: "240" # 4 hours
  JWT_AUTH_URL: "/goLogin"
  JWT_STATUS_URL: "/goStatus"
  JWT_COOKIE_NAME: "goJWT_token"

  # ----------------------------------
  # Default Admin User
  # ----------------------------------
  ADMIN_USER: "goadmin"
  ADMIN_EMAIL: "goadmin@yourdomain.com"
  ADMIN_ID: "999999"
  ADMIN_EXTERNAL_ID: "111111"
  ADMIN_PASSWORD: "changeme_admin_password"

  # ----------------------------------
  # Security / CORS
  # ----------------------------------
  ALLOWED_HOSTS: "localhost,your-app-domain.com" # Comma-separated list

  # ----------------------------------
  # Application Behavior
  # ----------------------------------
  # Set to "True" for production, "False" for development
  ENV_IS_PROD: "True"